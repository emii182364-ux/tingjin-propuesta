<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ting Jin Kitchenware – Maqueta</title>
<meta name="description" content="Maqueta de propuesta: fabricante taiwanés de campanas extractoras, estufas y calentadores de acero inoxidable desde 1986. OEM y marca propia.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --steel:#DDE3E6; --line:#C9D1D5;
  --ink:#172126; --muted:#56646B; --accent:#0E5A6B; --accent-ink:#FFFFFF;
  --flame:#E0662A; --wa:#1F9D55; --note:#FFF4D6; --note-ink:#6B4A00;
  --display:"Archivo","Noto Sans TC","PingFang TC","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(16px,4vw,40px); --max:1160px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1518; --surface:#161F23; --steel:#1E2A2F; --line:#2C3A40;
    --ink:#E6ECEE; --muted:#9AA9AF; --accent:#4FB3C6; --accent-ink:#0B1316;
    --flame:#F08A52; --wa:#3CC47A; --note:#3A2E12; --note-ink:#F5D98B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1518; --surface:#161F23; --steel:#1E2A2F; --line:#2C3A40;
  --ink:#E6ECEE; --muted:#9AA9AF; --accent:#4FB3C6; --accent-ink:#0B1316;
  --flame:#F08A52; --wa:#3CC47A; --note:#3A2E12; --note-ink:#F5D98B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
img,svg{max-width:100%;display:block}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--gutter)}
h1,h2,h3{font-family:var(--display);font-stretch:80%;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:750}
h3{font-size:1.25rem;font-weight:700}
.eyebrow{font:500 .78rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
section{padding-block:clamp(48px,8vw,88px)}
section+section{border-top:1px solid var(--line)}
.lead{color:var(--muted);max-width:62ch;margin:12px 0 0}

/* aviso maqueta */
.notice{background:var(--note);color:var(--note-ink);font-size:.85rem;text-align:center;padding:8px var(--gutter)}

/* cabecera */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;min-height:64px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{white-space:nowrap;font:800 1.35rem/1 var(--display);font-stretch:75%;letter-spacing:.02em}
.brand span{font:500 .7rem/1 var(--mono);color:var(--muted);letter-spacing:.06em}
nav{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;font-weight:500;font-size:.95rem}
nav a:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:6px;padding:11px 18px;font-weight:600;text-decoration:none;border:1px solid transparent;font-size:.95rem;cursor:pointer}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn-wa{background:var(--wa);color:#fff}
@media (max-width:760px){nav{display:none}.langs{margin-left:auto}}
@media (max-width:420px){.brand span{display:none}}

/* hero */
.hero{padding-block:clamp(40px,7vw,80px);background:linear-gradient(180deg,var(--surface),var(--bg))}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.4rem,6.2vw,4.4rem);font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:1.1rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:32px}
.facts div{background:var(--surface);padding:14px 16px}
.facts b{display:block;font:750 1.6rem/1 var(--display);font-stretch:80%;font-variant-numeric:tabular-nums}
.facts span{font-size:.82rem;color:var(--muted)}
.hero-art{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:100%}
.hero-art .shot{background:#fff;border:1px solid var(--line);border-radius:10px;display:grid;grid-template-rows:1fr auto;overflow:hidden}
.hero-art .shot.big{grid-column:1/-1}
.hero-art img{width:100%;height:100%;object-fit:contain;padding:14px;aspect-ratio:16/9}
.hero-art .shot.photo img{object-fit:cover;padding:0;aspect-ratio:16/10}
.hero-art .shot:not(.big) img{aspect-ratio:4/3}
.hero-art figcaption{font:500 .75rem/1.3 var(--mono);color:#56646B;padding:8px 12px;border-top:1px solid #E3E8EA;background:#F7F9FA}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}}

/* líneas */
.lines{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px}
.line-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:10px}
.line-card ul{margin:0;padding-left:18px;color:var(--muted)}
.line-card .for{font-size:.88rem}
@media (max-width:700px){.lines{grid-template-columns:1fr}}

/* catálogo */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 .88rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;padding:8%;border-bottom:1px solid var(--line)}
.card .ph img{width:100%;height:100%;object-fit:contain}
.card .body{padding:14px 16px 16px;display:grid;gap:6px;flex:1}
.card .model{font:500 .78rem var(--mono);color:var(--accent)}
.card h3{font-size:1.05rem;font-stretch:90%}
.card .spec{font-size:.85rem;color:var(--muted)}
.card a.more{margin-top:auto;font-weight:600;font-size:.9rem;text-decoration:none}
.tag{justify-self:start;font:500 .7rem/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:4px;background:var(--steel);color:var(--muted)}

/* ficha */
.detail{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;margin-top:32px;align-items:start}
.gallery{display:grid;gap:10px}
.gallery .main{background:#fff;border:1px solid var(--line);border-radius:10px;aspect-ratio:4/3;display:grid;place-items:center;padding:6%}
.gallery .main img{width:100%;height:100%;object-fit:contain}
.gallery .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gallery .thumbs div{background:var(--steel);border-radius:6px;aspect-ratio:1;display:grid;place-items:center;font:400 .7rem var(--mono);color:var(--muted);text-align:center;padding:4px}
.spec-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:.95rem}
.spec-table th,.spec-table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.spec-table th{width:42%;color:var(--muted);font-weight:500}
.spec-table td{font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums}
.todo{background:var(--note);color:var(--note-ink);padding:1px 5px;border-radius:3px;font-size:.8rem}
.table-wrap{overflow-x:auto}
@media (max-width:860px){.detail{grid-template-columns:1fr}}

/* OEM */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:32px;counter-reset:s;list-style:none;padding:0}
.steps li{padding:20px 20px 20px 0;border-top:3px solid var(--accent);counter-increment:s;display:grid;gap:6px}
.steps li+li{padding-left:20px;border-left:1px solid var(--line)}
.steps li::before{content:attr(data-label);font:500 .75rem var(--mono);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.steps p{margin:0;color:var(--muted);font-size:.92rem}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}.steps li:nth-child(3){padding-left:0;border-left:0}}
@media (max-width:480px){.steps{grid-template-columns:1fr}.steps li,.steps li+li{padding-left:0;border-left:0}}

/* confianza */
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}
.trust div{display:grid;gap:6px}
.trust p{margin:0;color:var(--muted);font-size:.95rem}
.markets{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
@media (max-width:760px){.trust{grid-template-columns:1fr}}

/* contacto */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:32px}
.channels{display:grid;gap:12px}
.channel{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;flex-wrap:wrap}
.channel b{display:block}
.channel span{font:400 .9rem var(--mono);color:var(--muted)}
form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
label{display:grid;gap:4px;font-size:.88rem;font-weight:500}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-msg{font-size:.9rem;color:var(--wa)}
@media (max-width:760px){.contact{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}

footer{background:var(--ink);color:var(--bg);padding-block:32px;font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:inherit}

.langs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.langs button{font:500 .82rem var(--body);background:var(--surface);color:var(--muted);border:0;padding:8px 10px;cursor:pointer}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
:lang(zh-Hant-TW) h1,:lang(zh-Hant-TW) h2,:lang(zh-Hant-TW) h3{font-stretch:100%;line-height:1.25;letter-spacing:.02em}
:lang(zh-Hant-TW) .hero h1{font-size:clamp(2rem,5vw,3.4rem)}
:lang(zh-Hant-TW) body{line-height:1.8}
/* pestaña lateral de propuesta */
.prop-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:30;writing-mode:vertical-rl;background:var(--flame);color:#fff;border:0;border-radius:8px 0 0 8px;padding:16px 10px;font:600 .9rem/1.2 var(--body);letter-spacing:.04em;cursor:pointer;box-shadow:-4px 4px 16px rgb(0 0 0 / .18)}
.prop-tab:hover{padding-right:14px}
.prop-panel{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(420px,100%);background:var(--surface);color:var(--ink);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgb(0 0 0 / .25);padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;display:grid;align-content:start;gap:14px}
.prop-panel.open{transform:none}
.prop-panel .by{font:500 .8rem var(--mono);color:var(--flame);letter-spacing:.06em;text-transform:uppercase}
.prop-panel h2{font-size:1.8rem}
.prop-panel .close{justify-self:end;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
.prop-slot{border:2px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted);font-size:.95rem}
.prop-scrim{position:fixed;inset:0;z-index:35;background:rgb(0 0 0 / .35)}
@media (max-width:760px){.prop-tab{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:none;font-size:.8rem;padding:12px 8px}}
.wa-float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 6px 20px rgb(0 0 0 / .2);border-radius:999px;padding:13px 18px}
</style>
</head>
<body>

<div class="notice" data-i18n="notice"></div>

<header>
  <div class="wrap bar">
    <a class="brand" href="#inicio"><b>TING JIN</b><span data-i18n="brandSub"></span></a>
    <nav aria-label="Menu">
      <a href="#lineas" data-i18n="navProducts"></a>
      <a href="#ficha" data-i18n="navSheet"></a>
      <a href="#oem" data-i18n="navOem"></a>
      <a href="#empresa" data-i18n="navCompany"></a>
      <a href="#contacto" data-i18n="navContact"></a>
    </nav>
    <div class="langs" role="group" aria-label="Idioma / Language / 語言">
      <button type="button" data-lang="zh" lang="zh-Hant-TW">中文</button>
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="es" lang="es">ES</button>
    </div>
  </div>
</header>

<main id="inicio">

<div class="hero">
  <div class="wrap hero-grid">
    <div>
      <p class="eyebrow" data-i18n="heroEyebrow"></p>
      <h1 data-i18n="heroTitle"></h1>
      <p class="lead" data-i18n="heroLead"></p>
      <div class="cta">
        <a class="btn btn-primary" href="#contacto" data-i18n="ctaQuote"></a>
        <a class="btn btn-ghost" href="#contacto" data-i18n="ctaCatalog"></a>
      </div>
      <div class="facts">
        <div><b>40</b><span data-i18n="fact1"></span></div>
        <div><b>AISI 430</b><span data-i18n="fact2"></span></div>
        <div><b>OEM</b><span data-i18n="fact3"></span></div>
      </div>
    </div>
    <div class="hero-art">
      <figure class="shot big photo" style="margin:0"><img src="https://images.unsplash.com/photo-1683470156390-703e9313dab6?w=1200&h=750&fit=crop&q=75" srcset="https://images.unsplash.com/photo-1683470156390-703e9313dab6?w=700&h=440&fit=crop&q=75 700w, https://images.unsplash.com/photo-1683470156390-703e9313dab6?w=1200&h=750&fit=crop&q=75 1200w" sizes="(max-width:860px) 100vw, 520px" data-i18n-alt="hero1alt" alt="" fetchpriority="high"><figcaption data-i18n="hero1"></figcaption></figure>
      <figure class="shot" style="margin:0"><img src="https://img.itaiwantrade.com/3523c62d-5830-4feb-989f-2baba811b296/m28-3.webp?d=480x480" data-i18n-alt="hero2" alt=""><figcaption data-i18n="hero2"></figcaption></figure>
      <figure class="shot" style="margin:0"><img src="https://img.itaiwantrade.com/3acd615e-7e56-4fcd-8b49-a055e0a80704/0315-B.webp?d=480x480" data-i18n-alt="hero3" alt=""><figcaption data-i18n="hero3"></figcaption></figure>
    </div>
  </div>
</div>

<section id="lineas">
  <div class="wrap">
    <p class="eyebrow" data-i18n="linesEyebrow"></p>
    <h2 data-i18n="linesTitle"></h2>
    <div class="lines">
      <div class="line-card">
        <span class="tag" data-i18n="homeTag"></span>
        <h3 data-i18n="homeTitle"></h3>
        <ul data-i18n="homeList"></ul>
        <p class="for" data-i18n="homeFor"></p>
      </div>
      <div class="line-card">
        <span class="tag" data-i18n="indTag"></span>
        <h3 data-i18n="indTitle"></h3>
        <ul data-i18n="indList"></ul>
        <p class="for" data-i18n="indFor"></p>
      </div>
    </div>

    <div class="filters" role="group">
      <button class="chip" type="button" data-f="all" aria-pressed="true" data-i18n="fAll"></button>
      <button class="chip" type="button" data-f="campana" aria-pressed="false" data-i18n="fHood"></button>
      <button class="chip" type="button" data-f="estufa" aria-pressed="false" data-i18n="fStove"></button>
      <button class="chip" type="button" data-f="calentador" aria-pressed="false" data-i18n="fHeater"></button>
      <button class="chip" type="button" data-f="industrial" aria-pressed="false" data-i18n="fInd"></button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section id="ficha">
  <div class="wrap">
    <p class="eyebrow" data-i18n="sheetEyebrow"></p>
    <h2 data-i18n="sheetTitle"></h2>
    <p class="lead" data-i18n="sheetLead"></p>
    <div class="detail">
      <div class="gallery">
        <div class="main"><img src="https://img.itaiwantrade.com/ca6f90a3-ca14-470f-ae4e-af7b75d6f86a/0908-2.webp?d=960x960" data-i18n-alt="sheetAlt" alt=""></div>
        <div class="thumbs">
          <div data-i18n="th1"></div><div data-i18n="th2"></div><div data-i18n="th3"></div><div data-i18n="th4"></div>
        </div>
      </div>
      <div>
        <p class="mono" style="margin:0;color:var(--accent)" data-i18n="sheetModel"></p>
        <div class="table-wrap">
        <table class="spec-table">
          <tr><th data-i18n="kMat"></th><td data-i18n="vMat"></td></tr>
          <tr><th data-i18n="kDim124"></th><td>1240 × 820 × 500 mm</td></tr>
          <tr><th data-i18n="kDim190"></th><td>1900 × 820 × 500 mm</td></tr>
          <tr><th data-i18n="kFlow"></th><td><span class="todo" data-i18n="todoFill"></span> m³/h</td></tr>
          <tr><th data-i18n="kNoise"></th><td><span class="todo" data-i18n="todoFill"></span> dB</td></tr>
          <tr><th data-i18n="kVolt"></th><td>110 V / 220 V <span class="todo" data-i18n="todoConfirm"></span></td></tr>
          <tr><th data-i18n="kMoq"></th><td><span class="todo" data-i18n="todoFill"></span> <span data-i18n="uUnits"></span></td></tr>
          <tr><th data-i18n="kLead"></th><td><span class="todo" data-i18n="todoFill"></span> <span data-i18n="uDays"></span></td></tr>
          <tr><th data-i18n="kCont"></th><td><span class="todo" data-i18n="todoFill"></span></td></tr>
          <tr><th data-i18n="kTerms"></th><td>FOB Taiwan · T/T <span class="todo" data-i18n="todoConfirm"></span></td></tr>
          <tr><th data-i18n="kOem"></th><td data-i18n="vOem"></td></tr>
        </table>
        </div>
        <div class="cta">
          <a class="btn btn-primary" href="#contacto" data-i18n="ctaQuoteModel"></a>
          <a class="btn btn-ghost" href="#contacto" data-i18n="ctaPdf"></a>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="oem">
  <div class="wrap">
    <p class="eyebrow" data-i18n="navOem"></p>
    <h2 data-i18n="oemTitle"></h2>
    <p class="lead" data-i18n="oemLead"></p>
    <ol class="steps">
      <li data-step="1"><h3 data-i18n="s1t"></h3><p data-i18n="s1p"></p></li>
      <li data-step="2"><h3 data-i18n="s2t"></h3><p data-i18n="s2p"></p></li>
      <li data-step="3"><h3 data-i18n="s3t"></h3><p data-i18n="s3p"></p></li>
      <li data-step="4"><h3 data-i18n="s4t"></h3><p data-i18n="s4p"></p></li>
    </ol>
  </div>
</section>

<section id="empresa">
  <div class="wrap">
    <p class="eyebrow" data-i18n="navCompany"></p>
    <h2 data-i18n="coTitle"></h2>
    <div class="trust">
      <div>
        <h3 data-i18n="coSince"></h3>
        <p data-i18n="coSinceP"></p>
      </div>
      <div>
        <h3 data-i18n="coExport"></h3>
        <div class="markets" data-i18n="coMarkets"></div>
      </div>
      <div>
        <h3 data-i18n="coCert"></h3>
        <p data-i18n="coCertP"></p>
      </div>
    </div>
  </div>
</section>

const HTML_LANG={es:'es',en:'en',zh:'zh-Hant-TW'};
let lang='es', filter='all';
const grid=document.getElementById('grid');
function render(){
  const t=T[lang];
  grid.innerHTML=P.filter(p=>filter==='all'||p.c.includes(filter)).map(p=>{
    const own=p.link.startsWith('#');
    return `<article class="card"><div class="ph"><img src="${I}${p.img}.webp?d=480x480" alt="${p.n[lang]}" loading="lazy" width="480" height="480"></div><div class="body">
    ${p.t?`<span class="tag">${t.featured}</span>`:''}
    <span class="model">${p.m?t.model+' '+p.m:t.noModel}</span><h3>${p.n[lang]}</h3><span class="spec">${p.s[lang]}</span>
    <a class="more" href="${p.link}"${own?'':' target="_blank" rel="noopener"'}>${own?t.seeSheet:t.seeStore} →</a>
   </div></article>`}).join('');
}
function setLang(l){
  if(!T[l]) l='es';
  lang=l;
  const t=T[l];
  document.documentElement.lang=HTML_LANG[l];
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=t[el.dataset.i18n]; if(v!==undefined) el.innerHTML=v;});
  document.querySelectorAll('[data-i18n-alt]').forEach(el=>{el.alt=t[el.dataset.i18nAlt]||'';});
  document.querySelectorAll('.steps li').forEach(li=>li.dataset.label=t.step+' '+li.dataset.step);
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  document.title='Ting Jin Kitchenware – '+(l==='zh'?'改版樣稿':l==='en'?'Mockup':'Maqueta');
  try{localStorage.setItem('tj-lang',l)}catch(e){}
  render();
}
let start='es';
try{start=localStorage.getItem('tj-lang')||''}catch(e){start=''}
if(!start){const q=new URLSearchParams(location.search).get('lang');const n=(navigator.language||'').toLowerCase();start=q||(n.startsWith('zh')?'zh':n.startsWith('es')?'es':n?'en':'es');}
const q=new URLSearchParams(location.search).get('lang'); if(q&&T[q]) start=q;
setLang(start);
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));
  filter=b.dataset.f; render();
}));
document.getElementById('quote').addEventListener('submit',e=>{e.preventDefault();document.getElementById('q-out').hidden=false;});
const pp=document.getElementById('prop-panel'),po=document.getElementById('prop-open'),ps=document.getElementById('prop-scrim');
function prop(open){pp.classList.toggle('open',open);pp.setAttribute('aria-hidden',!open);po.setAttribute('aria-expanded',open);ps.hidden=!open;if(open)document.getElementById('prop-close').focus();else po.focus();}
po.addEventListener('click',()=>prop(true));
document.getElementById('prop-close').addEventListener('click',()=>prop(false));
ps.addEventListener('click',()=>prop(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pp.classList.contains('open'))prop(false);});
</script>
